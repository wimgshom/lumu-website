<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    width: 100vw;
    height: 100vh;
    background: transparent;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    user-select: none;
    -webkit-user-select: none;
  }

  /* 舞台增加四周 padding，给阴影预留扩散空间 */
  .stage {
    position: relative;
    width: 100%;
    flex: 1;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 16px 24px;
    overflow: hidden;
  }

  /* 柔和环境漫反射阴影 */
  #cocktail-container {
    box-shadow: 
      0 12px 32px -4px rgba(0, 0, 0, 0.08), 
      0 4px 12px -2px rgba(0, 0, 0, 0.04);
    background: transparent;
    border-radius: 2px;
  }

  .page {
    background-color: #fff;
    overflow: hidden;
  }

  .page img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    pointer-events: none;
  }

  /* 底部 Prev / Next 按钮 */
  .controls {
    height: 46px;
    display: flex;
    align-items: center;
    gap: 24px;
    z-index: 1000;
  }

  .btn {
    background: rgba(0, 0, 0, 0.75);
    color: #fff;
    border: none;
    padding: 7px 22px;
    border-radius: 20px;
    font-size: 12px;
    letter-spacing: 0.8px;
    text-transform: uppercase;
    cursor: pointer;
    transition: background 0.2s, transform 0.15s;
  }
  .btn:hover {
    background: rgba(0, 0, 0, 0.95);
    transform: scale(1.04);
  }
</style>

<!-- 引入官方稳定版 Page-Flip -->
<script src="https://unpkg.com/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>
</head>
<body>

<div class="stage">
  <div id="cocktail-container">
    <!-- 左边初始展开页：封底 -->
    <div class="page">
      <img src="cocktail-back.webp" alt="Back Cover">
    </div>

    <!-- 右边初始展开页：封面 -->
    <div class="page">
      <img src="cocktail-cover.webp" alt="Cover">
    </div>

    <!-- 内部正文：第 1 页到第 28 页 -->
    <div class="page"><img src="cocktail-page1.webp"></div>
    <div class="page"><img src="cocktail-page2.webp"></div>
    <div class="page"><img src="cocktail-page3.webp"></div>
    <div class="page"><img src="cocktail-page4.webp"></div>
    <div class="page"><img src="cocktail-page5.webp"></div>
    <div class="page"><img src="cocktail-page6.webp"></div>
    <div class="page"><img src="cocktail-page7.webp"></div>
    <div class="page"><img src="cocktail-page8.webp"></div>
    <div class="page"><img src="cocktail-page9.webp"></div>
    <div class="page"><img src="cocktail-page10.webp"></div>
    <div class="page"><img src="cocktail-page11.webp"></div>
    <div class="page"><img src="cocktail-page12.webp"></div>
    <div class="page"><img src="cocktail-page13.webp"></div>
    <div class="page"><img src="cocktail-page14.webp"></div>
    <div class="page"><img src="cocktail-page15.webp"></div>
    <div class="page"><img src="cocktail-page16.webp"></div>
    <div class="page"><img src="cocktail-page17.webp"></div>
    <div class="page"><img src="cocktail-page18.webp"></div>
    <div class="page"><img src="cocktail-page19.webp"></div>
    <div class="page"><img src="cocktail-page20.webp"></div>
    <div class="page"><img src="cocktail-page21.webp"></div>
    <div class="page"><img src="cocktail-page22.webp"></div>
    <div class="page"><img src="cocktail-page23.webp"></div>
    <div class="page"><img src="cocktail-page24.webp"></div>
    <div class="page"><img src="cocktail-page25.webp"></div>
    <div class="page"><img src="cocktail-page26.webp"></div>

  </div>
</div>

<div class="controls">
  <button class="btn" id="btn-prev">Prev</button>
  <button class="btn" id="btn-next">Next</button>
</div>

<script>
  window.addEventListener('load', function() {
    var bookElem = document.getElementById('cocktail-container');
    var btnPrev = document.getElementById('btn-prev');
    var btnNext = document.getElementById('btn-next');

    // 单页比例严格锁定为 874 : 1122（即 437 : 561）
    var pageFlip = new St.PageFlip(bookElem, {
      width: 437,
      height: 561,
      size: "stretch",
      minWidth: 175,
      maxWidth: 874,
      minHeight: 224,
      maxHeight: 1122,
      drawShadow: true,
      flippingTime: 1100,
      showCover: false,
      usePortrait: false,
      startPage: 0,
      autoSize: true,
      useMouseEvents: true
    });

    pageFlip.loadFromHTML(document.querySelectorAll('.page'));

    btnNext.addEventListener('click', function() {
      pageFlip.flipNext();
    });

    btnPrev.addEventListener('click', function() {
      pageFlip.flipPrev();
    });

    window.addEventListener('resize', function() {
      pageFlip.updateFromHtml(document.querySelectorAll('.page'));
    });
  });
</script>

</body>
</html>
