<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  html, body {
    width: 100%;
    height: 100%;
    background: transparent;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }

  /* 核心比例容器：严格锁定 365:425，无圆角 */
  .slider-wrapper {
    position: relative;
    width: 100%;
    max-width: 365px;
    aspect-ratio: 365 / 425;
    overflow: hidden;
    border-radius: 0;
    background-color: #111;
    user-select: none;
  }

  @supports not (aspect-ratio: 365 / 425) {
    .slider-wrapper {
      height: 0;
      padding-bottom: 116.438%;
    }
  }

  .slides-track {
    display: flex;
    width: 100%;
    height: 100%;
    transition: transform 0.45s cubic-bezier(0.25, 0.8, 0.25, 1);
  }

  .slide {
    flex: 0 0 100%;
    width: 100%;
    height: 100%;
  }

  .slide img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    pointer-events: none;
  }

  /* 左右切换箭头 */
  .nav-btn {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    width: 32px;
    height: 32px;
    border: none;
    border-radius: 50%;
    background: rgba(0, 0, 0, 0.45);
    color: #fff;
    font-size: 16px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.2s;
    z-index: 10;
  }

  .nav-btn:hover {
    background: rgba(0, 0, 0, 0.75);
  }

  .prev-btn { left: 10px; }
  .next-btn { right: 10px; }

  /* 底部指示器圆点 */
  .dots {
    position: absolute;
    bottom: 12px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 8px;
    z-index: 10;
  }

  .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.45);
    border: none;
    cursor: pointer;
    transition: transform 0.2s, background 0.2s;
  }

  .dot.active {
    background: #ffffff;
    transform: scale(1.25);
  }
</style>
</head>
<body>

<div class="slider-wrapper" id="slider">
  <div class="slides-track" id="track">
    <div class="slide"><img src="barpic1.jpg" alt="图片 1"></div>
    <div class="slide"><img src="barpic2.jpg" alt="图片 2"></div>
    <div class="slide"><img src="barpic3.jpg" alt="图片 3"></div>
    <div class="slide"><img src="barpic4.jpg" alt="图片 4"></div>
  </div>

  <button class="nav-btn prev-btn" id="prevBtn" aria-label="上一张">&#10094;</button>
  <button class="nav-btn next-btn" id="nextBtn" aria-label="下一张">&#10095;</button>

  <div class="dots" id="dots">
    <button class="dot active" data-index="0" aria-label="第 1 张"></button>
    <button class="dot" data-index="1" aria-label="第 2 张"></button>
    <button class="dot" data-index="2" aria-label="第 3 张"></button>
    <button class="dot" data-index="3" aria-label="第 4 张"></button>
  </div>
</div>

<script>
  (function () {
    const track = document.getElementById('track');
    const dots = document.querySelectorAll('.dot');
    const slider = document.getElementById('slider');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const total = 4;
    let currentIndex = 0;
    let autoPlayTimer = null;

    function goToSlide(index) {
      currentIndex = (index + total) % total;
      track.style.transform = `translateX(-${currentIndex * 100}%)`;
      dots.forEach((dot, i) => {
        dot.classList.toggle('active', i === currentIndex);
      });
    }

    function startAutoPlay() {
      stopAutoPlay();
      autoPlayTimer = setInterval(() => goToSlide(currentIndex + 1), 2000);
    }

    function stopAutoPlay() {
      if (autoPlayTimer) clearInterval(autoPlayTimer);
    }

    prevBtn.addEventListener('click', () => {
      goToSlide(currentIndex - 1);
      startAutoPlay();
    });

    nextBtn.addEventListener('click', () => {
      goToSlide(currentIndex + 1);
      startAutoPlay();
    });

    dots.forEach(dot => {
      dot.addEventListener('click', (e) => {
        goToSlide(Number(e.target.dataset.index));
        startAutoPlay();
      });
    });

    slider.addEventListener('mouseenter', stopAutoPlay);
    slider.addEventListener('mouseleave', startAutoPlay);

    let startX = 0;
    slider.addEventListener('touchstart', (e) => {
      startX = e.touches[0].clientX;
      stopAutoPlay();
    }, { passive: true });

    slider.addEventListener('touchend', (e) => {
      const diffX = e.changedTouches[0].clientX - startX;
      if (Math.abs(diffX) > 40) {
        goToSlide(diffX > 0 ? currentIndex - 1 : currentIndex + 1);
      }
      startAutoPlay();
    });

    startAutoPlay();
  })();
</script>

</body>
</html>
